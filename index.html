<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal de Disponibilidad</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #eaf0f7, #dce6f1);
    color: #183153;
    min-height: 100vh;
    padding: 30px 20px;
}

/* CONTENEDOR PRINCIPAL */
.portal {
    max-width: 1500px;
    margin: auto;
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(20, 48, 80, 0.15);
    border: 1px solid #dce5ef;
}

/* ENCABEZADO */
.header {
    background: linear-gradient(120deg, #102f50, #1d5685);
    padding: 28px 35px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}

.header-info h1 {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.header-info p {
    font-size: 13px;
    color: #c9dced;
    letter-spacing: 0.5px;
}

.header-icon {
    width: 55px;
    height: 55px;
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
}

/* BARRA INFORMATIVA */
.info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: #f4f7fb;
    border-bottom: 1px solid #e2eaf2;
    flex-wrap: wrap;
    gap: 12px;
}

.info-label {
    font-size: 12px;
    font-weight: 700;
    color: #385675;
    letter-spacing: 0.7px;
    text-transform: uppercase;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    color: #56718d;
}

.status-dot {
    width: 9px;
    height: 9px;
    background: #24ad75;
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(36,173,117,0.12);
}

/* CUERPO DEL INFORME */
.report-section {
    padding: 22px;
    background: #f0f4f9;
}

.report-container {
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #dbe4ee;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(30, 60, 90, 0.07);
    position: relative;
}

/* IFRAME RESPONSIVO */
.report-container iframe {
    display: block;
    width: 100%;
    height: 850px;
    border: none;
    background: white;
}

/* PIE DE PÁGINA */
.footer {
    padding: 16px 30px;
    background: #ffffff;
    border-top: 1px solid #e8edf3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.footer span {
    font-size: 11px;
    color: #8192a5;
}

.footer strong {
    color: #1d5685;
}

/* RESPONSIVE */
@media (max-width: 768px) {

    body {
        padding: 10px;
    }

    .header {
        padding: 22px;
    }

    .header-info h1 {
        font-size: 20px;
    }

    .report-section {
        padding: 10px;
    }

    .report-container iframe {
        height: 700px;
    }

    .footer {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="portal">

    <!-- ENCABEZADO -->
    <header class="header">

        <div class="header-info">
            <h1>PORTAL DE DISPONIBILIDAD</h1>
            <p>CONSULTA Y GESTIÓN DE AGENDA · SISTEMA DE RESERVAS</p>
        </div>

        <div class="header-icon">
            📅
        </div>

    </header>

    <!-- INFORMACIÓN -->
    <div class="info-bar">

        <div class="info-label">
            📊 Panel de disponibilidad mensual
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Visualización del informe
        </div>

    </div>

    <!-- INFORME POWER BI -->
    <main class="report-section">

        <div class="report-container">

            <iframe
                title="DISPONIBILIDAD"
                src="https://app.powerbi.com/reportEmbed?reportId=5790d42c-f97d-47f5-ba5d-2772f409ed38&autoAuth=true&ctid=b0364bc5-3bfe-4864-a2ed-3ebb68c608ad"
                frameborder="0"
                allowFullScreen="true">
            </iframe>

        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">

        <span>
            Sistema de consulta de disponibilidad
        </span>

        <span>
            Desarrollado con <strong>Power BI</strong>
        </span>

    </footer>

</div>

</body>
</html>
